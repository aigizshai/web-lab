openapi: 3.0.0
paths:
  /users:
    post:
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Создать пользователя
      tags:
        - Пользователи
      parameters:
        - in: query
          name: name
          required: true
          description: Имя пользователя
          schema:
            type: string
        - in: query
          name: email
          required: true
          description: Email пользователя
          schema:
            type: string
            format: email
        - in: query
          name: password
          required: true
          description: Пароль пользователя
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
          schema:
            $ref: "#/components/schemas/User"
      responses:
        201:
          description: Пользователь создан
        400:
          description: Неверные входные данные
        500:
          description: Ошибка сервера
    get:
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Получить список пользователей
      tags:
        - Пользователи
      responses:
        200:
          description: Список пользователей
        content:
          application/json:
            schema:
              type: array
            items:
              $ref: "#/components/schemas/User"
        500:
          description: Ошибка сервера